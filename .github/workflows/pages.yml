name: Build and Deploy Bloody Math Web

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pygbag
        run: python -m pip install --upgrade pygbag

      - name: Optimize web audio assets
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          for f in game/audio/*.ogg; do
            tmp="${f}.web.ogg"
            ffmpeg -hide_banner -loglevel error -y -i "$f" -ar 24000 -ac 1 -c:a libvorbis -q:a 4 "$tmp"
            mv "$tmp" "$f"
          done

      - name: Build WebAssembly game
        run: 'python -m pygbag --build --no_opt --width 1280 --height 800 --ume_block 1 --title "Bloody Math: Algebra Quest" game'

      - name: Publish browser audio assets
        run: |
          mkdir -p game/build/web/audio
          cp game/audio/*.ogg game/build/web/audio/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
